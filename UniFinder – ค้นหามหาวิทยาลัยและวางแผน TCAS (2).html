let CY=2570,CM=null,CCY=null,CR=0;
function tcas(y,r){if(y)CY=+y;if(r)CR=+r;
 const all=Store.tcas(CY),ro=all.filter(x=>!CR||x.round==CR);
 if(CM===null||CCY!==CY){const t=TODAY.getFullYear()+543==CY||CCY===null&&1?TODAY:null;const s=D(all[0].start);CM=s.getMonth();CCY=CY;CMY=s.getFullYear()}
 return`${notice()}<h1 style="font-size:28px;margin:0 0 4px">ปฏิทิน TCAS</h1>
 <div class="filters"><select id="yr" aria-label="ปีการศึกษา">${Store.years.map(y=>`<option ${y==CY?"selected":""} value="${y}">ปีการศึกษา ${y}</option>`).join("")}</select><select id="rd"><option value="0">ทุกรอบ</option>${all.map(x=>`<option value="${x.round}" ${x.round==CR?"selected":""}>${x.name}</option>`).join("")}</select></div>
 <div class="card"><div class="row sp"><button class="btn ghost" data-m="-1">‹</button><b>${TM[CM]} ${CMY+543}</b><button class="btn ghost" data-m="1">›</button></div>
 <div class="cal" style="margin-top:10px">${["อา","จ","อ","พ","พฤ","ศ","ส"].map(d=>`<div class="h">${d}</div>`).join("")}${calCells(ro)}</div>
 <div class="leg" style="margin-top:10px">${all.map(x=>`<span style="--c:${RC[x.round]}"><i></i>${x.name}</span>`).join("")}</div></div>
 <h2>รายการกำหนดการ</h2><div class="grid">${ro.map(rc).join("")}</div>${src()}`}
let CMY=2026;
function calCells(ro){const first=new Date(CMY,CM,1).getDay(),n=new Date(CMY,CM+1,0).getDate();let h="<div></div>".repeat(first);
 for(let d=1;d<=n;d++){const iso=`${CMY}-${String(CM+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;let dots="";
  ro.forEach(r=>{const ks=[];if(iso>=r.start&&iso<=r.end)ks.push(1);[r.result,r.confirm,r.waive].includes(iso)&&ks.push(1);if(ks.length)dots+=`<i class="dot" style="--c:${RC[r.round]}${[r.result,r.confirm,r.waive].includes(iso)?";height:9px":""}" title="${r.name}"></i>`});
  h+=`<div class="${iso==TODAY.toISOString().slice(0,10)||(D(iso).getTime()==TODAY.getTime())?"t":""}">${d}${dots}</div>`}return h}
function rc(r){const[s,t]=status(r);return`<div class="card bd4" style="--c:${RC[r.round]}"><div class="row sp"><h3>${r.name}</h3><span class="st s${s}">${t}</span></div>
 <div class="tl"><span>รับสมัคร</span><span>${fd(r.start)} – ${fd(r.end)}</span><span>ประกาศผล</span><span>${fd(r.result)}</span><span>ยืนยันสิทธิ์</span><span>${fd(r.confirm)}</span><span>สละสิทธิ์</span><span>${r.waive?fd(r.waive):"ไม่มี"}</span></div>
 <p><a class="btn ghost" target="_blank" rel="noopener" href="${r.url}">ตรวจสอบที่เว็บไซต์ทางการ</a></p></div>`}

const readLogo=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const w=i.width||160,h=i.height||160,k=Math.min(1,160/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/png"))};i.src=r.result};r.readAsDataURL(f)});

function route(){const p=(location.hash||"#/").slice(2).split("/"),a=$("#app");
 document.querySelectorAll("nav a").forEach(n=>n.classList.toggle("on",n.dataset.p==p[0]));
 if(p[0]=="unis"&&p[1])a.innerHTML=detail(p[1]);
 else if(p[0]=="unis"){a.innerHTML=unis(sessionStorage_q());filt()}
 else if(p[0]=="tcas")a.innerHTML=tcas(p[1],p[2]);
 else if(p[0]=="admin")a.innerHTML=admin();
 else if(p[0]=="about")a.innerHTML=about();
 else{a.innerHTML=home()}
 applySite();tick();window.scrollTo(0,0)}
let SQ="";const sessionStorage_q=()=>{const q=SQ;SQ="";return q};
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.fav){e.preventDefault();e.stopPropagation();const id=+t.dataset.fav,f=Store.favs();Store.favs(f.includes(id)?f.filter(x=>x!=id):[...f,id]);const p=(location.hash||"").split("/");if(p[1]=="unis"&&!p[2])filt();else route()}
 else if(t.dataset.m){CM+=+t.dataset.m;if(CM<0){CM=11;CMY--}if(CM>11){CM=0;CMY++}$("#app").innerHTML=tcas()}
 else if(t.id=="add")form();
 else if(t.id=="ed")form(Store.unis().find(x=>x.id==t.dataset.id));
 else if(t.id=="del"&&confirm("ลบมหาวิทยาลัยนี้ใช่หรือไม่?")){Store.remove(t.dataset.id);location.hash="#/unis"}
 else if(t.id=="rst"&&confirm("คืนค่าเป็นข้อมูลตัวอย่าง? ข้อมูลที่แก้ไขจะหายไป")){Store.reset();route()}
 else if(t.dataset.eu)form(Store.unis().find(x=>x.id==t.dataset.eu));
 else if(t.dataset.du&&confirm("ลบมหาวิทยาลัยนี้ใช่หรือไม่?")){Store.remove(t.dataset.du);route()}
 else if(t.id=="af"){$("#fl").insertAdjacentHTML("beforeend",facRow({n:"",m:[]}))}
 else if(t.hasAttribute("data-rf")){t.closest(".frow").remove()}
 else if(t.id=="lo"){ADM=false;route()}
 else if(t.id=="ax"){readSet();const s=Store.S();Store.setS({exams:[...s.exams,{n:"",d:""}]});route()}
 else if(t.dataset.rx){readSet();const s=Store.S();s.exams.splice(+t.dataset.rx,1);Store.setS({exams:s.exams});route()}});
document.addEventListener("input",e=>{if(["q","rg","pv","ty","fo"].includes(e.target.id))filt()});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id=="yr"){CY=+t.value;CCY=null;route2()}
 else if(t.id=="rd"){CR=+t.value;route2()}
 else if(["rg","pv","ty","fo"].includes(t.id))filt();
 else if(t.id=="csv"&&t.files[0]){const r=new FileReader();r.onload=()=>{Store.importCSV(r.result);route()};r.readAsText(t.files[0])}});
const route2=()=>{$("#app").innerHTML=tcas()};
document.addEventListener("submit",e=>{if(e.target.id=="hs"){e.preventDefault();SQ=$("#hq").value;location.hash="#/unis"}
 else if(e.target.id=="lf"){e.preventDefault();if($("#pw").value==Store.S().pass){ADM=true;route()}else $("#lm").textContent="รหัสผ่านไม่ถูกต้อง"}
 else if(e.target.id=="sf"){e.preventDefault();readSet();route();$("#sm").textContent="บันทึกแล้ว ✓"}});
route();

</script>
